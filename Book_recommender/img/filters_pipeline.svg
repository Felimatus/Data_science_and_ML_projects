<svg viewBox="0 0 850 384" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#1b1b1b"/>
    </marker>
  </defs>

  <!-- figure background / frame -->
  <rect x="3" y="3" width="844" height="378" rx="14" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.5"/>

  <!-- incoming arrow -->
  <line x1="32" y1="215" x2="78" y2="215" stroke="#1b1b1b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ===== Model wrapper (green) ===== -->
  <rect x="82" y="55" width="686" height="274" rx="18" fill="#C3ECC4" stroke="#1b1b1b" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="425" y="96" text-anchor="middle" font-size="30" font-weight="700" fill="#141414">Model</text>

  <!-- ===== Find ISBNs (soft red) ===== -->
  <rect x="104" y="175" width="150" height="80" rx="16" fill="#F4A8A2" stroke="#1b1b1b" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="179" y="222" text-anchor="middle" font-size="19" font-weight="600" fill="#141414">Find ISBNs</text>

  <line x1="258" y1="215" x2="298" y2="215" stroke="#1b1b1b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ===== Calculation (light blue) ===== -->
  <rect x="302" y="175" width="160" height="80" rx="16" fill="#AECBE8" stroke="#1b1b1b" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="382" y="222" text-anchor="middle" font-size="22" font-weight="600" fill="#141414">Calculation</text>

  <line x1="466" y1="215" x2="506" y2="215" stroke="#1b1b1b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ===== Three filters container (yellow) ===== -->
  <rect x="510" y="119" width="236" height="192" rx="16" fill="#FBEFA1" stroke="#1b1b1b" stroke-width="2.5" filter="url(#shadow)"/>

  <rect x="528" y="137" width="200" height="44" rx="10" fill="#F4A8A2" stroke="#1b1b1b" stroke-width="1.6"/>
  <text x="628" y="164" text-anchor="middle" font-size="14" font-weight="500" fill="#141414">Filter <tspan font-style="italic">eligible</tspan> ISBNs</text>

  <rect x="528" y="193" width="200" height="44" rx="10" fill="#F4A8A2" stroke="#1b1b1b" stroke-width="1.6"/>
  <text x="628" y="220" text-anchor="middle" font-size="14" font-weight="500" fill="#141414">Remove <tspan font-style="italic">similar</tspan> items</text>

  <rect x="528" y="249" width="200" height="44" rx="10" fill="#F4A8A2" stroke="#1b1b1b" stroke-width="1.6"/>
  <text x="628" y="276" text-anchor="middle" font-size="14" font-weight="500" fill="#141414">Keep <tspan font-style="italic">good</tspan> books</text>

  <!-- outgoing arrow -->
  <line x1="772" y1="215" x2="818" y2="215" stroke="#1b1b1b" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
